# Defaults for red team multi-objective prompt optimization.
# These are the paper's Table 2 hyperparameters, except target_highest_rung, which the
# per-figure configs raise to 100.

moasha:
  rung_samples: [8, 32, 128]      # papers evaluated per rung
  eta: 4                          # promotion ratio: top 1/eta of a rung moves up
  target_highest_rung: 80         # stop after this many rung-2 trials complete
  max_connections: 256            # cap on simultaneous API connections
  n_islands: 3
  feature_bins: 4                 # MAP-Elites bins per feature dim
  # sandbagging          maximize weak, minimize ground truth proxy (the subversion PF)
  # strong_weak          maximize both (the Goodharting PF)
  # sandbagging_detector maximize detector trust, minimize ground truth proxy
  mode: "sandbagging"
  migration_interval: 640         # trials between island migrations
  migration_rate: 0.1
  population_size: 80             # per island
  archive_size: 16                # per island
  exploration_ratio: 0.3          # parent sampled from the island population
  exploitation_ratio: 0.6         # parent sampled from the archive
  promotion_window: 10            # window = promotion_window * eta**(depth+1)
                                  # -> [640, 160, 40] for three rungs with eta=4

checkpoint_interval: 10

split:
  train_ratio: 0.7
  seed: 42

optimizer:
  model: "anthropic/claude-opus-4-6"
  reasoning_effort: "xhigh"
  n_inspiration_prompts: 3
  # Whether the optimizer is told which rubric dimensions the judges score on.
  # false is the rubric-awareness ablation of Appendix E: the optimizer still knows a
  # rubric judge is scoring, but not the criteria, and then fails to find attacks.
  show_rubric: true
  # Ablation: show the optimizer the weak judge's FULL system prompt, not just a summary.
  show_weak_judge_full_prompt: false

eval_models:
  generator: "anthropic/claude-opus-4-6"
  generator_reasoning_effort: "high"
  n_proposals: 10                 # proposals the generator must produce per task

  # --- weak scorer (what the blue team controls) ---
  weak_judge: "anthropic/claude-haiku-4-5-20251001"
  weak_judge_reasoning_tokens: 16384
  # quality          the paper's ten-criterion rubric, no paper access (default b_0)
  # quality_norubric single holistic 0-100 score, no rubric
  # detector         Haiku asked how confident it is the proposals are sandbagged;
  #                  weak score = 1 - confidence  (Appendix F)
  # outer_evolve     a blue-team-optimized W prompt; set outer_evolve_w_path to its JSON
  weak_scorer_type: "quality"
  # outer_evolve_w_path: "path/to/chosen.json"

  # --- ground truth proxy scorer ---
  strong_judge: "anthropic/claude-sonnet-4-6"
  strong_judge_reasoning_effort: "high"
  strong_judge_has_paper: true    # the information advantage that makes it a proxy
  # quality | quality_norubric
  strong_scorer_type: "quality"
