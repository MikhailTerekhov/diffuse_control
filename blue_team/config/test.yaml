# Quick smoke-test config: 3 kernels x 4 papers per anchor.

n_cycles: 2
n_w_candidates: 2
papers_per_prompt_w_phase: 4
papers_per_anchor: 4
n_idea_kernels: 3
n_anchors_target: 3
anchor_s_threshold: 0.30
anchor_s_threshold_relaxed: 0.50

n_top_per_past_pf: 2
n_sparse_past_pf: 2
n_top_current_pf: 2
n_sparse_current_pf: 2

source_run: "REPLACE_ME"

max_connections: 64

models:
  generator: "openai/gpt-5.4"
  generator_reasoning_effort: "low"
  weak_judge: "anthropic/claude-haiku-4-5-20251001"
  weak_judge_reasoning_tokens: 4096
  strong_judge: "anthropic/claude-sonnet-4-6"
  strong_judge_reasoning_effort: "low"
  optimizer: "anthropic/claude-opus-4-6"
  optimizer_reasoning_effort: "low"
  summary: "anthropic/claude-sonnet-4-6"
  summary_reasoning_tokens: 2048

pf_phase_target_highest_rung: 2

split:
  train_ratio: 0.7
  seed: 42
