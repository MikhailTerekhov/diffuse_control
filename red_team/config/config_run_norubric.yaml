# Rubric-awareness ablation: same as config_run_rubric but the optimizer is
# not told the rubric dimensions. It then fails to find effective attacks.
moasha:
  rung_samples: [8, 32, 128]
  eta: 4
  target_highest_rung: 100
  max_connections: 128
  n_islands: 3
  feature_bins: 4
  mode: "sandbagging"
  population_size: 80
  archive_size: 16
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  promotion_window: 10

optimizer:
  show_rubric: false

checkpoint_interval: 10
