# Stage 1: GPT-5.4 as the generator.
moasha:
  rung_samples: [8, 32, 128]
  eta: 4
  target_highest_rung: 50
  max_connections: 128
  n_islands: 3
  feature_bins: 4
  mode: "sandbagging"
  population_size: 80
  archive_size: 16
  exploration_ratio: 0.3
  exploitation_ratio: 0.6
  promotion_window: 10

optimizer:
  show_rubric: true

eval_models:
  generator: "openai/gpt-5.4"
  generator_reasoning_effort: "high"
  weak_scorer_type: "quality"
  strong_scorer_type: "quality"

checkpoint_interval: 50
